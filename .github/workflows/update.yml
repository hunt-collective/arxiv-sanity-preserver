# Fetches new papers from arXiv into the database and recomputes the features.
# Needs the repository secret DATABASE_URL (the same Postgres the Vercel app uses).
name: update papers

on:
  schedule:
    - cron: '17 3 * * *' # daily, a few hours after arXiv's evening (US Eastern) announcement
  workflow_dispatch:
    inputs:
      num:
        description: 'up to how many of the newest papers to fetch'
        default: '2000'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
      - run: pip install -r requirements.txt
      - name: fetch papers and recompute features
        env:
          NUM: ${{ inputs.num || '2000' }}
        run: |
          # arxiv_daemon.py exits with 1 when there were no new papers
          if python arxiv_daemon.py --num "$NUM"; then
            python compute.py
          else
            echo "No new papers were added, skipping feature computation"
          fi
